# =============================================================================
# PRODUCCIÓN — AWS Lightsail VPS (~/emitesis)
# =============================================================================
# NO es Neon. La BD es el contenedor "db" (Postgres local en Docker).
# Desarrollo con npm run dev → Neon en api-emitesis/.env (otra BD distinta).
#
# Despliegue: git push main → GitHub Actions copia este archivo y ejecuta
# ensure-migrations.sh antes de reiniciar api/web.
#
# Operaciones manuales en VPS: ver scripts/ops/README.md
#   ./manage-db.sh reset --force   → borrar datos y re-sembrar
#   ./manage-db.sh repair          → error P3005 (schema sin migraciones)
#
# IMPORTANTE:
# - Arranque API: node dist/main.js  (NO dist/src/main.js)
# - Healthcheck: usa Node (Alpine no incluye wget)
# - SKIP_PRISMA_SEED=true en prod; seed manual con manage-db.sh o ensure-migrations
# - Web depende de api healthy → si api falla, web no arranca
# =============================================================================

services:
  db:
    image: postgres:15-alpine
    container_name: emitesis-db-prod
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-emitesis_db}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-emitesis_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - emitesis-network-prod

  api:
    image: ghcr.io/${GITHUB_REPOSITORY}-api:latest
    container_name: emitesis-api-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${API_PORT:-5000}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:password@db:5432/emitesis_db?schema=public}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:password@db:5432/emitesis_db?schema=public}
      JWT_SECRET: ${JWT_SECRET:-EmitesisSecretKey2026!}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost:3005}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:-localhost}
      WEBAUTHN_ORIGIN: ${WEBAUTHN_ORIGIN:-http://localhost:3005}
      MAIL_USER: ${MAIL_USER:-}
      MAIL_PASS: ${MAIL_PASS:-}
      # En prod el entrypoint NO ejecuta seed automático (evita borrar datos en cada restart).
      SKIP_PRISMA_SEED: ${SKIP_PRISMA_SEED:-true}
      SKIP_RECAPTCHA: ${SKIP_RECAPTCHA:-}
      RECAPTCHA_SECRET_KEY: ${RECAPTCHA_SECRET_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # Nest compila a dist/main.js (no dist/src/main.js). Mantener alineado con Dockerfile CMD.
    command: ["node", "dist/main.js"]
    volumes:
      - api_uploads_prod:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # Usar Node: la imagen Alpine no trae wget y el check fallaba con "unhealthy".
      test:
        [
          "CMD-SHELL",
          "node -e \"require('http').get('http://127.0.0.1:'+(process.env.PORT||5000)+'/api/health',(r)=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))\"",
        ]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 180s
    networks:
      - emitesis-network-prod
 
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}-web:latest
    container_name: emitesis-web-prod
    restart: always
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT:-3005}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - emitesis-network-prod

  nginx:
    image: nginx:1.25-alpine
    container_name: emitesis-proxy-prod
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - web
      - api
    networks:
      - emitesis-network-prod

networks:
  emitesis-network-prod:
    driver: bridge

volumes:
  postgres_data_prod:
  api_uploads_prod:
