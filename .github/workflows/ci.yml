name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (api-emitesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: emitesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api-emitesis
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # Sin package-lock.json, la caché de npm de setup-node falla ("paths were not resolved").
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public

      - name: Run Lint
        run: npm run lint || true

      - name: Run Tests with Coverage
        run: npm run test:cov || true
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public

      - name: Build Application
        run: npm run build

  frontend:
    name: Frontend (web-emitesis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-emitesis
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Lint
        run: npm run lint || true

      - name: Build Application
        run: npm run build

  build-and-push:
    name: Build & Push to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker (Backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./api-emitesis
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata for Docker (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./web-emitesis
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api

  deploy:
    name: Deploy to AWS VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create app directory and copy config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx.conf,backup-db.sh,manage-db.sh,certs/origin.pem,certs/origin.key"
          target: "~/emitesis"

      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          DOMAIN: ${{ secrets.DOMAIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR,ENV_PROD,DOMAIN
          script: |
            set -e

            # Crear directorio si no existe y asegurar ubicacion
            mkdir -p ~/emitesis
            cd ~/emitesis

            # Escribir el archivo .env de produccion y limpiar retornos de carro de Windows (CRLF -> LF)
            echo "$ENV_PROD" | tr -d '\r' > .env

            # Asegurar que la variable DOMAIN este presente en el archivo .env si es requerida
            if ! grep -q "DOMAIN=" .env; then
              echo "DOMAIN=$DOMAIN" >> .env
            else
              sed -i "s/DOMAIN=.*/DOMAIN=$DOMAIN/" .env
            fi

            # Validar consistencia de credenciales en el archivo .env
            if [ -f .env ]; then
              ENV_USER=$(grep "^POSTGRES_USER=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'")
              ENV_USER=${ENV_USER:-postgres}
              
              ENV_PASS=$(grep "^POSTGRES_PASSWORD=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'")
              ENV_PASS=${ENV_PASS:-password}
              
              ENV_DB=$(grep "^POSTGRES_DB=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'")
              ENV_DB=${ENV_DB:-emitesis_db}

              DB_URL=$(grep "^DATABASE_URL=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'")
              
              echo "=== CONTROL DE CALIDAD DE VARIABLES DE ENTORNO ==="
              if [ -n "$DB_URL" ]; then
                DB_URL_CLEAN=$(echo "$DB_URL" | cut -d'?' -f1)
                DB_URL_NO_PROTO=$(echo "$DB_URL_CLEAN" | sed -E 's|.*://||')
                DB_URL_AUTH=$(echo "$DB_URL_NO_PROTO" | cut -d'@' -f1)
                DB_URL_HOST_DB=$(echo "$DB_URL_NO_PROTO" | cut -d'@' -f2)
                
                DB_URL_USER=$(echo "$DB_URL_AUTH" | cut -d':' -f1)
                DB_URL_PASS=$(echo "$DB_URL_AUTH" | cut -d':' -f2)
                DB_URL_DB=$(echo "$DB_URL_HOST_DB" | cut -d'/' -f2)

                ERROR_DETECTADO=0
                if [ "$ENV_USER" != "$DB_URL_USER" ]; then
                  echo "❌ ERROR: El usuario en POSTGRES_USER ('$ENV_USER') no coincide con el usuario en DATABASE_URL ('$DB_URL_USER')."
                  ERROR_DETECTADO=1
                fi
                if [ "$ENV_PASS" != "$DB_URL_PASS" ]; then
                  echo "❌ ERROR: La contraseña en POSTGRES_PASSWORD no coincide con la contraseña configurada en DATABASE_URL."
                  ERROR_DETECTADO=1
                fi
                if [ "$ENV_DB" != "$DB_URL_DB" ]; then
                  echo "❌ ERROR: La base de datos en POSTGRES_DB ('$ENV_DB') no coincide con la base de datos en DATABASE_URL ('$DB_URL_DB')."
                  ERROR_DETECTADO=1
                fi
                
                if [ $ERROR_DETECTADO -eq 1 ]; then
                  echo "Por favor, corrige tu secreto ENV_PROD en GitHub para que las credenciales coincidan."
                  exit 1
                else
                  echo "✅ Las credenciales en POSTGRES_USER/PASSWORD/DB coinciden con DATABASE_URL."
                fi
              else
                echo "⚠️ ADVERTENCIA: DATABASE_URL no está definida en el archivo .env, usando valores por defecto."
              fi
            fi

            # Asegurar formato LF y permisos de ejecucion para los scripts operativos
            sed -i 's/\r$//' backup-db.sh manage-db.sh || true
            chmod +x backup-db.sh
            chmod +x manage-db.sh


            # Iniciar sesion en GitHub Container Registry para poder descargar las imagenes
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # TEMPORAL: Limpiar volúmenes corruptos de la base de datos (se removerá después de este despliegue)
            docker-compose -f docker-compose.prod.yml down -v || true

            # Descargar las imagenes mas recientes desde GHCR
            docker-compose -f docker-compose.prod.yml pull

            # Levantar/Actualizar los servicios en segundo plano con eliminacion de contenedores huerfanos
            if ! docker-compose -f docker-compose.prod.yml up -d --remove-orphans; then
              echo "=== ERROR AL INICIAR LOS CONTENEDORES ==="
              echo "=== LOGS DE LA BASE DE DATOS ==="
              docker-compose -f docker-compose.prod.yml logs --tail=100 db || true
              echo "=== LOGS DEL API (BACKEND) ==="
              docker-compose -f docker-compose.prod.yml logs --tail=100 api || true
              echo "=== LOGS DEL WEB (FRONTEND) ==="
              docker-compose -f docker-compose.prod.yml logs --tail=100 web || true
              exit 1
            fi

            # Limpiar imagenes obsoletas o sin etiqueta para evitar consumo innecesario de almacenamiento en el VPS
            docker image prune -f


