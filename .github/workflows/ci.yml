name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v6

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'api-emitesis/**'
              - 'package-lock.json'
            web:
              - 'web-emitesis/**'
              - 'package-lock.json'
            infra:
              - 'docker-compose.prod.yml'
              - 'nginx.conf'
              - 'scripts/ops/**'
              - 'certs/**'

  backend:
    name: Backend (api-emitesis)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: emitesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api-emitesis
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public

      - name: Run Lint
        run: npm run lint || true

      - name: Run Tests with Coverage
        run: npm run test:cov || true
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public

      - name: Build Application
        run: npm run build

  frontend:
    name: Frontend (web-emitesis)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-emitesis
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Lint
        run: npm run lint || true

      - name: Build Application
        run: npm run build

  build-api:
    name: Build & Push API image
    needs: [changes, backend]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.api == 'true' &&
      needs.backend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker (Backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./api-emitesis
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          provenance: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

  build-web:
    name: Build & Push Web image
    needs: [changes, frontend]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.web == 'true' &&
      needs.frontend.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./web-emitesis
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          provenance: false
          build-args: |
            NEXT_PUBLIC_API_URL=/api
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=6Lej8bosAAAAAHS1jnehMjfBm1FZ6a6a__3Yuteg
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

  deploy:
    name: Deploy to AWS VPS
    runs-on: ubuntu-latest
    needs: [changes, build-api, build-web]
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.api == 'true' || needs.changes.outputs.web == 'true' || needs.changes.outputs.infra == 'true') &&
      (needs.build-api.result == 'success' || needs.build-api.result == 'skipped') &&
      (needs.build-web.result == 'success' || needs.build-web.result == 'skipped')
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create app directory and copy config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx.conf,scripts/ops/backup-db.sh,scripts/ops/manage-db.sh,certs/origin.pem,certs/origin.key"
          target: "~/emitesis"

      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          DOMAIN: ${{ secrets.DOMAIN }}
          DEPLOY_API: ${{ needs.changes.outputs.api }}
          DEPLOY_WEB: ${{ needs.changes.outputs.web }}
          DEPLOY_INFRA: ${{ needs.changes.outputs.infra }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR,ENV_PROD,DOMAIN,DEPLOY_API,DEPLOY_WEB,DEPLOY_INFRA
          script: |
            set -e

            echo "=== Despliegue selectivo ==="
            echo "API:   $DEPLOY_API"
            echo "Web:   $DEPLOY_WEB"
            echo "Infra: $DEPLOY_INFRA"

            mkdir -p ~/emitesis
            cd ~/emitesis

            echo "$ENV_PROD" | tr -d '\r' > .env

            while IFS= read -r line || [ -n "$line" ]; do
              if [[ "$line" =~ ^# ]] || [[ -z "$line" ]]; then
                echo "$line"
              else
                key=$(echo "$line" | cut -d'=' -f1)
                val=$(echo "$line" | cut -d'=' -f2-)

                key="${key#${key%%[![:space:]]*}}"
                key="${key%${key##*[![:space:]]}}"
                val="${val#${val%%[![:space:]]*}}"
                val="${val%${val##*[![:space:]]}}"

                val="${val#\"}"
                val="${val%\"}"
                val="${val#\'}"
                val="${val%\'}"

                echo "$key=$val"
              fi
            done < .env > .env.tmp && mv .env.tmp .env

            sed -i '/^POSTGRES_USER=/d' .env || true
            sed -i '/^POSTGRES_PASSWORD=/d' .env || true
            sed -i '/^POSTGRES_DB=/d' .env || true
            sed -i '/^DATABASE_URL=/d' .env || true
            sed -i '/^DIRECT_URL=/d' .env || true

            echo "POSTGRES_USER=postgres" >> .env
            echo "POSTGRES_PASSWORD=EmitesPass2026" >> .env
            echo "POSTGRES_DB=emitesis_db" >> .env
            echo "DATABASE_URL=postgresql://postgres:EmitesPass2026@db:5432/emitesis_db?schema=public" >> .env
            echo "DIRECT_URL=postgresql://postgres:EmitesPass2026@db:5432/emitesis_db?schema=public" >> .env

            sed -i '/^CORS_ORIGINS=/d' .env || true
            sed -i '/^PUBLIC_APP_URL=/d' .env || true
            sed -i '/^WEBAUTHN_RP_ID=/d' .env || true
            sed -i '/^WEBAUTHN_ORIGIN=/d' .env || true

            echo "CORS_ORIGINS=https://$DOMAIN" >> .env
            echo "PUBLIC_APP_URL=https://$DOMAIN" >> .env
            echo "WEBAUTHN_RP_ID=$DOMAIN" >> .env
            echo "WEBAUTHN_ORIGIN=https://$DOMAIN" >> .env

            echo "=== DIAGNÓSTICO SEGURO DE VARIABLES EN .ENV ==="
            while IFS= read -r line || [ -n "$line" ]; do
              if [[ "$line" =~ ^# ]] || [[ -z "$line" ]]; then
                continue
              fi
              key=$(echo "$line" | cut -d'=' -f1)
              val=$(echo "$line" | cut -d'=' -f2-)

              if [[ "$key" == *"PASSWORD"* ]] || [[ "$key" == *"SECRET"* ]] || [[ "$key" == *"KEY"* ]] || [[ "$key" == *"TOKEN"* ]] || [[ "$key" == *"PASS"* ]]; then
                echo "$key: longitud=${#val} | empieza con: '${val:0:1}' | termina con: '${val: -1}'"
              elif [[ "$key" == "DATABASE_URL" ]] || [[ "$key" == "DIRECT_URL" ]]; then
                masked_val=$(echo "$val" | sed -E 's/:[^:@]*@/:***@/')
                echo "$key: $masked_val"
              else
                echo "$key: $val"
              fi
            done < .env

            if ! grep -q "DOMAIN=" .env; then
              echo "DOMAIN=$DOMAIN" >> .env
            else
              sed -i "s/DOMAIN=.*/DOMAIN=$DOMAIN/" .env
            fi

            if [ -f .env ]; then
              ENV_USER=$(grep "^POSTGRES_USER=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'")
              ENV_USER=${ENV_USER:-postgres}

              ENV_PASS=$(grep "^POSTGRES_PASSWORD=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'")
              ENV_PASS=${ENV_PASS:-password}

              ENV_DB=$(grep "^POSTGRES_DB=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'")
              ENV_DB=${ENV_DB:-emitesis_db}

              DB_URL=$(grep "^DATABASE_URL=" .env | cut -d'=' -f2- | tr -d '"' | tr -d "'")

              echo "=== CONTROL DE CALIDAD DE VARIABLES DE ENTORNO ==="
              if [ -n "$DB_URL" ]; then
                DB_URL_CLEAN=$(echo "$DB_URL" | cut -d'?' -f1)
                DB_URL_NO_PROTO=$(echo "$DB_URL_CLEAN" | sed -E 's|.*://||')
                DB_URL_AUTH=$(echo "$DB_URL_NO_PROTO" | cut -d'@' -f1)
                DB_URL_HOST_DB=$(echo "$DB_URL_NO_PROTO" | cut -d'@' -f2)

                DB_URL_USER=$(echo "$DB_URL_AUTH" | cut -d':' -f1)
                DB_URL_PASS=$(echo "$DB_URL_AUTH" | cut -d':' -f2)
                DB_URL_DB=$(echo "$DB_URL_HOST_DB" | cut -d'/' -f2)

                ERROR_DETECTADO=0
                if [ "$ENV_USER" != "$DB_URL_USER" ]; then
                  echo "❌ ERROR: El usuario en POSTGRES_USER ('$ENV_USER') no coincide con el usuario en DATABASE_URL ('$DB_URL_USER')."
                  ERROR_DETECTADO=1
                fi
                if [ "$ENV_PASS" != "$DB_URL_PASS" ]; then
                  echo "❌ ERROR: La contraseña en POSTGRES_PASSWORD no coincide con la contraseña configurada en DATABASE_URL."
                  ERROR_DETECTADO=1
                fi
                if [ "$ENV_DB" != "$DB_URL_DB" ]; then
                  echo "❌ ERROR: La base de datos en POSTGRES_DB ('$ENV_DB') no coincide con la base de datos en DATABASE_URL ('$DB_URL_DB')."
                  ERROR_DETECTADO=1
                fi

                if [ $ERROR_DETECTADO -eq 1 ]; then
                  echo "Por favor, corrige tu secreto ENV_PROD en GitHub para que las credenciales coincidan."
                  exit 1
                else
                  echo "✅ Las credenciales en POSTGRES_USER/PASSWORD/DB coinciden con DATABASE_URL."
                fi
              else
                echo "⚠️ ADVERTENCIA: DATABASE_URL no está definida en el archivo .env, usando valores por defecto."
              fi
            fi

            if [ -d scripts/ops ]; then
              mv scripts/ops/backup-db.sh .
              mv scripts/ops/manage-db.sh .
              rm -rf scripts
            fi

            sed -i 's/\r$//' backup-db.sh manage-db.sh || true
            chmod +x backup-db.sh
            chmod +x manage-db.sh

            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            DEPLOY_SERVICES=""

            if [ "$DEPLOY_API" = "true" ]; then
              echo "→ Descargando imagen del API..."
              docker-compose -f docker-compose.prod.yml pull api
              DEPLOY_SERVICES="$DEPLOY_SERVICES api"
            fi

            if [ "$DEPLOY_WEB" = "true" ]; then
              echo "→ Descargando imagen del frontend..."
              docker-compose -f docker-compose.prod.yml pull web
              DEPLOY_SERVICES="$DEPLOY_SERVICES web"
            fi

            if [ "$DEPLOY_INFRA" = "true" ]; then
              echo "→ Actualizando infraestructura (nginx / compose)..."
              DEPLOY_SERVICES="$DEPLOY_SERVICES nginx"
            fi

            if [ -z "$DEPLOY_SERVICES" ]; then
              echo "No hay servicios que actualizar."
              exit 0
            fi

            echo "→ Reiniciando servicios:$DEPLOY_SERVICES"
            if ! docker-compose -f docker-compose.prod.yml up -d --remove-orphans $DEPLOY_SERVICES; then
              echo "=== ERROR AL INICIAR LOS CONTENEDORES ==="
              echo "=== ESTADO DE TODOS LOS CONTENEDORES ==="
              docker ps -a || true
              echo "=== LOGS DE LA BASE DE DATOS (DOCKER LOGS) ==="
              docker logs emitesis-db-prod || true
              echo "=== LOGS DEL API (DOCKER LOGS) ==="
              docker logs emitesis-api-prod || true
              echo "=== LOGS DEL WEB (DOCKER LOGS) ==="
              docker logs emitesis-web-prod || true
              exit 1
            fi

            docker image prune -f
