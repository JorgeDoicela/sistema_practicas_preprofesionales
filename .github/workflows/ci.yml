name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend:
    name: Backend (api-emitesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: emitesis_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: api-emitesis
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          # Sin package-lock.json, la caché de npm de setup-node falla ("paths were not resolved").
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Migrations
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public

      - name: Run Lint
        run: npm run lint || true

      - name: Run Tests with Coverage
        run: npm run test:cov || true
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public
          DIRECT_URL: postgresql://postgres:password@localhost:5432/emitesis_test?schema=public

      - name: Build Application
        run: npm run build

  frontend:
    name: Frontend (web-emitesis)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-emitesis
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Security Audit
        run: npm audit --audit-level=high || true

      - name: Run Lint
        run: npm run lint || true

      - name: Build Application
        run: npm run build

  build-and-push:
    name: Build & Push to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker (Backend)
        id: meta-backend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-api
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Backend image
        uses: docker/build-push-action@v7
        with:
          context: ./api-emitesis
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}

      - name: Extract metadata for Docker (Frontend)
        id: meta-frontend
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}-web
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push Frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./web-emitesis
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=/api

  deploy:
    name: Deploy to AWS VPS
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create app directory and copy config files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "docker-compose.prod.yml,nginx.conf,backup-db.sh,manage-db.sh,certs/origin.pem,certs/origin.key"
          target: "~/emitesis"

      - name: Execute remote deployment commands via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          ENV_PROD: ${{ secrets.ENV_PROD }}
          DOMAIN: ${{ secrets.DOMAIN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          envs: GITHUB_TOKEN,GITHUB_ACTOR,ENV_PROD,DOMAIN
          script: |
            set -e

            # Crear directorio si no existe y asegurar ubicacion
            mkdir -p ~/emitesis
            cd ~/emitesis

            # Escribir el archivo .env de produccion a partir del secret
            echo "$ENV_PROD" > .env

            # Asegurar que la variable DOMAIN este presente en el archivo .env si es requerida
            if ! grep -q "DOMAIN=" .env; then
              echo "DOMAIN=$DOMAIN" >> .env
            else
              sed -i "s/DOMAIN=.*/DOMAIN=$DOMAIN/" .env
            fi

            # Asegurar permisos de ejecucion para el script de respaldo automatizado
            chmod +x backup-db.sh

            # Asegurar permisos de ejecucion para el script gestor unificado de base de datos
            chmod +x manage-db.sh


            # Iniciar sesion en GitHub Container Registry para poder descargar las imagenes
            echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

            # Descargar las imagenes mas recientes desde GHCR
            docker-compose -f docker-compose.prod.yml pull

            # Levantar/Actualizar los servicios en segundo plano con eliminacion de contenedores huerfanos
            if ! docker-compose -f docker-compose.prod.yml up -d --remove-orphans; then
              echo "=== ERROR AL INICIAR LOS CONTENEDORES ==="
              echo "=== LOGS DE LA BASE DE DATOS ==="
              docker-compose -f docker-compose.prod.yml logs --tail=100 db || true
              echo "=== LOGS DEL API (BACKEND) ==="
              docker-compose -f docker-compose.prod.yml logs --tail=100 api || true
              echo "=== LOGS DEL WEB (FRONTEND) ==="
              docker-compose -f docker-compose.prod.yml logs --tail=100 web || true
              exit 1
            fi

            # Limpiar imagenes obsoletas o sin etiqueta para evitar consumo innecesario de almacenamiento en el VPS
            docker image prune -f


